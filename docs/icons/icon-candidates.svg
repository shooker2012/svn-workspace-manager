    <g transform="translate(48 104)">
      <path d="M12 22h74l18 22v118H12z" fill="#e7f0ff" stroke="#2f6feb" stroke-width="8" stroke-linejoin="round"/>
      <path d="M108 22h74l18 22v118h-92z" fill="#e4f5e9" stroke="#2c7a4b" stroke-width="8" stroke-linejoin="round"/>
      <path class="line" d="M70 105h78M122 84l26 21-26 21" stroke="#2457a6" stroke-width="11"/>
      <circle cx="56" cy="76" r="11" fill="#2f6feb"/><circle cx="144" cy="76" r="11" fill="#2c7a4b"/>
    </g>
    <text x="132" y="278" text-anchor="middle" class="caption">直观表达 · 一眼看懂映射</text>
  </g>

  <g transform="translate(600 24)">
    <rect class="card" width="264" height="312" rx="18"/>
    <text x="24" y="38" class="title">C · SVN 同步</text><text x="24" y="62" class="caption">版本、更新、同步</text>
    <g transform="translate(46 94)">
      <circle cx="86" cy="86" r="76" fill="#e7f0ff" stroke="#2f6feb" stroke-width="9"/>
      <path class="line" d="M45 70a52 52 0 0 1 91-18l18 14M151 102a52 52 0 0 1-91 18l-18-14" stroke="#2f6feb" stroke-width="12"/>
      <path class="line" d="m143 51 12 15-20 4M52 119l-12-15 20-4" stroke="#2c7a4b" stroke-width="10"/>
      <circle cx="86" cy="86" r="25" fill="#fff" stroke="#2c7a4b" stroke-width="8"/><path class="line" d="M86 71v17l12 8" stroke="#2c7a4b" stroke-width="7"/>
    </g>
    <text x="132" y="278" text-anchor="middle" class="caption">强调更新 · 适合 SVN 工具</text>
  </g>

  <g transform="translate(888 24)">
    <rect class="card" width="264" height="312" rx="18"/>
    <text x="24" y="38" class="title">D · 工作区节点</text><text x="24" y="62" class="caption">多个任务共享一个测试入口</text>
    <g transform="translate(48 92)">
      <circle cx="84" cy="86" r="34" fill="#2f6feb"/>
      <path class="line" d="M84 120v53M84 86 30 48M84 86l54-38M84 173H38M84 173h46" stroke="#2457a6" stroke-width="10"/>
      <circle cx="30" cy="48" r="22" fill="#e4f5e9" stroke="#2c7a4b" stroke-width="8"/><circle cx="138" cy="48" r="22" fill="#fff0ce" stroke="#c58a18" stroke-width="8"/><circle cx="38" cy="173" r="22" fill="#dceaff" stroke="#2f6feb" stroke-width="8"/><circle cx="130" cy="173" r="22" fill="#e4f5e9" stroke="#2c7a4b" stroke-width="8"/>
      <path d="M74 78h20v20H74z" fill="#fff"/><path d="M74 145h20v20H74z" fill="#fff"/>

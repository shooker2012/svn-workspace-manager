<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#f3f6fb"/>
  <style>
    .card{fill:#fff;stroke:#d9e1ee;stroke-width:2}.title{font:600 18px 'Segoe UI',sans-serif;fill:#172033}.caption{font:13px 'Segoe UI',sans-serif;fill:#637083}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <g transform="translate(24 24)">
    <rect class="card" width="264" height="312" rx="18"/>
    <text x="24" y="38" class="title">A · 任务分层</text><text x="24" y="62" class="caption">任务、工作区、映射关系</text>
    <g transform="translate(62 92)">
      <rect x="24" y="0" width="116" height="86" rx="12" fill="#dceaff" stroke="#2f6feb" stroke-width="7"/>
      <rect x="0" y="56" width="116" height="86" rx="12" fill="#e4f5e9" stroke="#2c7a4b" stroke-width="7"/>
      <rect x="48" y="112" width="116" height="86" rx="12" fill="#fff0ce" stroke="#c58a18" stroke-width="7"/>
      <path class="line" d="M82 84h-24M140 140h-22" stroke="#fff" stroke-width="13"/><path class="line" d="M82 84h-24M140 140h-22" stroke="#637083" stroke-width="5"/>
      <circle cx="82" cy="42" r="12" fill="#2f6feb"/><circle cx="58" cy="98" r="12" fill="#2c7a4b"/><circle cx="106" cy="154" r="12" fill="#c58a18"/>
    </g>
    <text x="132" y="278" text-anchor="middle" class="caption">层级清晰 · 适合管理器</text>
  </g>

  <g transform="translate(312 24)">
